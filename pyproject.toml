
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotstuff-pharmachain"
version = "0.1.0"
description = "HotStuff BFT pharmaceutical supply chain simulator"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "cryptography>=43,<48",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "pre-commit>=4,<5",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pharmachain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 200
target-version = "py311"

extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "results",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: errores de estilo
    "F",    # Pyflakes: errores de Python
    "I",    # isort: ordenación de imports
    "B",    # flake8-bugbear: posibles bugs
    "UP",   # pyupgrade: sintaxis moderna
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
