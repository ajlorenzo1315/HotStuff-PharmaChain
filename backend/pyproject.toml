
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotstuff-pharmachain"
version = "0.1.0"
description = "HotStuff BFT pharmaceutical supply chain simulator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "cryptography>=43,<48",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pharmachain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
